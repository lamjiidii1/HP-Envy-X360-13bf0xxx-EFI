name: validate

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build every variant with the example identity
        run: |
          make variants PYTHON=python3 IDENTITY=private/identity.example.plist VERIFY_FLAGS=--allow-blank-identity
      - name: Verify templates and payload hashes
        run: |
          python3 scripts/payload_inventory.py > /tmp/payloads.tsv
          diff -u audit/payloads.tsv /tmp/payloads.tsv
      - name: Confirm no private identity is tracked
        run: |
          if git ls-files | grep -q '^private/identity.plist$'; then
            echo "private/identity.plist must never be committed" >&2
            exit 1
          fi
